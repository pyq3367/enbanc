[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enbanc"
version = "0.2.0"
description = "Long-haul verification for high-value artifacts: produce, check, judge, escalate, refuse to ship until it passes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "enbanc contributors" }]
keywords = ["agents", "verification", "review", "orchestration", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
enbanc = "enbanc.cli:main"

[project.urls]
Homepage = "https://github.com/pyq3367/enbanc"
Repository = "https://github.com/pyq3367/enbanc"
Issues = "https://github.com/pyq3367/enbanc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
